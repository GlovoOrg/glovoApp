version: '3.8'
services:
  glovo-postgres:
    image: postgres:15-alpine
    restart: always
    container_name: db-postgres
    environment:
      POSTGRES_USER: glovoTeam
      POSTGRES_PASSWORD: glovoTeam
      POSTGRES_DB: glovoDB
    ports:
      - "5442:5432"
    networks:
      - glovoApp-backend
    volumes:
      - glovo-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "glovoTeam", "-d", "glovoDB" ]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_reservation: 128M

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - glovoApp-backend
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_reservation: 128M
  redis:
    image: bitnami/redis:latest
    container_name: cache-redis
    environment:
      REDIS_PASSWORD: glovoTeam
    ports:
      - "6379:6379"
    networks:
      - glovoApp-backend
    mem_reservation: 256M

volumes:
  glovo-data: {}
networks:
  glovoApp-backend:
    driver: bridge