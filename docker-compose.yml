version: '3.8'
services:
  glovo-postgres:
    image: postgres:15-alpine
    restart: always
    container_name: db-pg
    environment:
      POSTGRES_USER: glovoTeam
      POSTGRES_PASSWORD: glovoTeam
      POSTGRES_DB: glovoDB
    ports:
      - "5442:5432"
    networks:
      - glovoApp-backend
    volumes:
      - glovo-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "glovoTeam", "-d", "glovoDB" ]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_reservation: 128M

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - glovoApp-backend
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_reservation: 128M

  redis:
    image: bitnami/redis:latest
    container_name: cache-redis
    environment:
      REDIS_PASSWORD: glovoTeam
    ports:
      - "6379:6379"
    networks:
      - glovoApp-backend
    mem_reservation: 256M

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: stripe-cli
    environment:
      - STRIPE_API_KEY=sk_test_51QmyzgKXEAbvN8fNH574XqzghIqD1jyKw1TYEXd5En77ZO7bNGrBFf79OXd244tAVbFB0kcuQ6Yxi8vFOcbRdn31004cx8ylOn # Замените на ваш тестовый API-ключ Stripe
      - STRIPE_DEVICE_NAME=local-glovo # Имя устройства для Stripe CLI
    command: listen --forward-to http://host.docker.internal:8080/api/v1/payments/webhook # Укажите URL вашего приложения
    ports:
      - "4242:4242" # Порт для Stripe CLI (по умолчанию для вебхуков)
    networks:
      - glovoApp-backend
    depends_on:
      - glovo-postgres # Предполагаем, что Stripe может зависеть от базы данных
    volumes:
      - ./stripe:/stripe # Опционально: для сохранения конфигурации
    mem_reservation: 64M

volumes:
  glovo-data: {}
  minio_data: {}
networks:
  glovoApp-backend:
    driver: bridge